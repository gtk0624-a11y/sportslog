<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두근두근 자리 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7ec;--ink:#27402f;--sub:#6b7f70;--green:#2f5d3f;--lime:#a6dd6b;--lime2:#e4f5cc;--pink:#ffd9e4;--sky:#d9efff;--peach:#ffe6c9;--line:#dfe8d6;--card:#fff;--orange:#e8772e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
h1,h2,h3{font-family:'Noto Serif KR','Noto Sans KR',serif;margin:0;font-weight:400}
.view{display:none;position:fixed;inset:0}
.view.on{display:flex}
/* ---------- setup ---------- */
#setup{background:linear-gradient(180deg,#f6f9ef,#eef5e2)}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.logo .lg{width:44px;height:44px;border-radius:14px;background:var(--green);display:grid;place-items:center;overflow:hidden}
.logo b{font-family:'Noto Serif KR';font-size:18px;line-height:1.1;display:block}
.logo small{color:var(--sub);font-size:11px}
.nav-h{font-size:11px;color:var(--sub);margin:12px 6px 2px}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:none;text-align:left;font-size:14px;width:100%}
.nav i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#eef2ea;display:grid;place-items:center;font-size:12px;flex:none}
.nav span{flex:1}.nav em{font-style:normal;font-size:11px;color:var(--sub)}
.nav.on{background:var(--lime2);font-weight:700}.nav.on i{background:var(--green);color:#fff}
.grow{flex:1}
.ready{background:var(--lime2);border-radius:12px;padding:10px 12px;font-size:12px}
.ready b{display:block;font-size:13px}
.ready.bad{background:#ffe8e0}
.go{background:var(--lime);border-radius:14px;padding:14px;font-size:16px;font-weight:700;font-family:'Noto Serif KR';box-shadow:0 3px 0 #86bf4c}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #86bf4c}
.panel{flex:1;min-width:0;padding:24px 22px;overflow:auto}
.prev{width:36%;max-width:520px;min-width:300px;padding:24px 22px 24px 0;overflow:auto}
.panel h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;line-height:1.55;margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(60,90,50,.07);margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:8px}
textarea,select,input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfdf8;color:var(--ink)}
textarea{height:300px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn{background:#eef2ea;padding:10px 14px;border-radius:12px;font-size:13px}
.btn.pri{background:var(--green);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:active{filter:brightness(.95)}
.seg{display:inline-flex;background:#eef2ea;border-radius:12px;padding:3px}
.seg button{background:none;padding:8px 14px;border-radius:10px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:700}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;background:#eef2ea;font-size:18px}
.step b{min-width:26px;text-align:center;font-size:18px}
.field{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0}
.field label{font-size:13px;color:var(--sub)}
.tog{position:relative;width:46px;height:26px;border-radius:13px;background:#cfd8c8;flex:none}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on:after{left:23px}
.note{font-size:12px;color:var(--sub);line-height:1.55}
.ok{background:var(--lime2);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.warn{background:#ffe8e0;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#eef2ea;border-radius:20px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--green);color:#fff}
.chip.f.on{background:#d9658a}.chip.m.on{background:#4a7fbf}
.list>div{display:flex;justify-content:space-between;align-items:center;background:#f4f7ef;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.list button{background:none;color:var(--orange);font-size:12px}
.pcard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(60,90,50,.07)}
.ptitle{font-family:'Noto Serif KR';font-size:16px;margin-bottom:10px}
.board{background:var(--green);color:#fff;text-align:center;border-radius:10px;padding:6px;font-size:12px;letter-spacing:6px}
.desk{width:70px;margin:6px auto 10px;background:var(--peach);border-radius:8px;text-align:center;font-size:11px;padding:3px;letter-spacing:3px}
.prow{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.pg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;flex:1}
.pc{background:#f3f6ee;border:1.5px solid #e3ead9;border-radius:8px;min-height:40px;padding:3px;font-size:10px;line-height:1.25;text-align:center;display:grid;place-items:center;color:#506253;word-break:keep-all}
.pc.fx{background:#efe4ff;border-color:#c9a9f5;color:#4b2f7e;font-weight:700;font-size:12px}
.pc.blk{background:transparent;border:1.5px dashed #cdd8c4;color:#cdd8c4}
.pc.pick{cursor:pointer}.pc.pick:hover{border-color:var(--green);background:var(--lime2)}
.pc.f{box-shadow:inset 3px 0 0 #ffb3c8}.pc.m{box-shadow:inset 3px 0 0 #a9d1ff}
.mascot svg,.mascot img{display:block}
/* ---------- stage ---------- */
#stage{background:#e9f3dc}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;pointer-events:none;z-index:3;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.hud.top{top:0}.hud.bot{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.pill{background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;gap:8px;align-items:center}
.pill.g{background:var(--green);color:#fff}
.pill button{background:none;font-size:13px;padding:0 2px}
.pill button.on{font-weight:700;color:var(--green)}
.bar{width:90px;height:7px;background:#dfe8d6;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .4s}
.chipmsg{background:#fff;border-radius:18px;padding:8px 14px;min-width:200px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.chipmsg b{font-family:'Noto Serif KR';font-size:20px;margin-right:6px}.chipmsg small{display:block;color:var(--sub);font-size:11.5px}
.sp{flex:1}
.big{background:#fff;border-radius:26px;padding:14px 34px;font-size:18px;font-family:'Noto Serif KR';box-shadow:0 3px 0 #c9d6bc,0 4px 14px rgba(0,0,0,.1)}
.big.hot{background:var(--lime);box-shadow:0 3px 0 #86bf4c}
.big:disabled{opacity:.6}
.finish{position:absolute;inset:0;background:rgba(30,50,35,.45);display:none;place-items:center;z-index:5}
.finish.on{display:grid}
.fbox{background:#fff;border-radius:26px;padding:26px 34px;text-align:center;max-width:420px}
.fbox h2{font-size:28px;margin:8px 0 4px}
/* ---------- result ---------- */
#result{flex-direction:column;overflow:auto;padding:20px;background:#f4f7ec}
.rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{font-size:26px;flex:1;min-width:200px}
.sheetbox{background:#fff;border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(60,90,50,.08);margin-bottom:14px}
.sheetbox>h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{max-width:1000px;margin:0 auto}
.sheet .bd{background:var(--green);color:#fff;text-align:center;border-radius:10px;padding:8px;letter-spacing:10px;font-size:14px;margin-bottom:8px}
.sheet .tb{width:90px;margin:0 auto 10px;background:var(--peach);text-align:center;border-radius:8px;padding:4px;font-size:12px;letter-spacing:4px}
.sheet .sr{display:flex;justify-content:space-between;gap:3%;margin-bottom:8px}
.sheet .sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;flex:1}
.sheet .sc{background:#fbfdf8;border:1.5px solid #cfdcc3;border-radius:10px;min-height:50px;display:grid;place-items:center;font-size:clamp(12px,1.9vw,19px);font-weight:700;padding:4px;text-align:center}
.sheet .sc.f{background:#fff4f8}.sheet .sc.m{background:#f2f8ff}.sheet .sc.x{visibility:hidden}
.sheet .sc.e{background:#f2f2f2;color:#bbb;font-weight:400}
.sheet.flip .bdw{order:99}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gc{border-radius:16px;padding:12px 16px;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.gc .gh{font-family:'Noto Serif KR';font-size:20px;margin-bottom:6px}
.gc ul{list-style:none;margin:0;padding:0}.gc li{font-size:17px;font-weight:700;padding:3px 0}
.c0{background:#ffe3ec}.c1{background:#fff0c2}.c2{background:#dff3e4}.c3{background:#ddeeff}.c4{background:#eadfff}.c5{background:#ffe5d2}
#clsbar{margin-bottom:6px}
#printArea{display:none}
/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#27402f;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(30,50,35,.45);display:none;place-items:center;z-index:50}
#modal.on{display:grid}
.mbox{background:#fff;border-radius:20px;padding:22px;width:min(340px,90vw)}
.mbox h3{margin-bottom:10px;font-size:18px}
.stamp-anim{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (max-width:900px){
  #setup{flex-direction:column;overflow:auto}
  .side{width:auto;flex-direction:row;flex-wrap:wrap;padding:10px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .logo{width:100%;margin:0}.nav-h,.grow{display:none}
  .nav{width:auto;padding:7px 10px;font-size:12.5px}.nav em{display:none}
  .ready{width:100%}.go{width:100%}
  .panel{overflow:visible;padding:14px}.prev{width:auto;max-width:none;padding:0 14px 90px;overflow:visible}
  textarea{height:200px}
  .chipmsg{min-width:0;flex:1}.bar{width:60px}
}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  @page{size:A4 landscape;margin:12mm}
  #printArea h1{font-size:22px;text-align:center;margin-bottom:12px}
  #printArea .sheet{max-width:none}
  #printArea .sc{border:1.5px solid #333!important;background:#fff!important;min-height:62px;font-size:17px;border-radius:6px}
  #printArea .bd{background:#fff!important;color:#000!important;border:2px solid #333}
  #printArea .tb{background:#fff!important;border:1.5px solid #333}
  #printArea .gc{border:2px solid #333!important;background:#fff!important;break-inside:avoid}
  #printArea .foot{margin-top:8px;font-size:10px;text-align:right;color:#555}
}
</style>
</head>
<body>
<div id="app">
  <!-- ================= 준비 화면 ================= -->
  <section id="setup" class="view on">
    <aside class="side">
      <div class="logo"><div class="lg mascot" id="logoMascot"></div><div><b>두근두근 자리 뽑기</b><small>크레인이 정해 주는 우리 반 자리</small></div></div>
      <div id="clsbar"></div>
      <div class="nav-h">자리 뽑기 준비</div>
      <div id="nav"></div>
      <div class="grow"></div>
      <div class="ready" id="ready"></div>
      <button class="go" id="goBtn">▶ 자리 뽑기 시작</button>
      <button class="go" id="goGroup" style="background:#ffd9e4;box-shadow:0 3px 0 #f0a9c0">▶ 모둠 뽑기 시작</button>
    </aside>
    <main class="panel" id="panel"></main>
    <div class="prev" id="prev"></div>
  </section>

  <!-- ================= 뽑기 화면 ================= -->
  <section id="stage" class="view">
    <canvas id="cv"></canvas>
    <div class="hud top">
      <div class="pill g" id="hudTitle">● 두근두근 자리 뽑기</div>
      <div class="pill">남은 상품 <b id="remain">0</b>개 <span class="bar"><i id="bar"></i></span></div>
      <div class="chipmsg" id="chipmsg"><b>준비</b><small>뽑기 버튼을 눌러 주세요</small></div>
      <div class="sp"></div>
      <div class="pill"><button id="bSound" title="효과음">🔊</button><button id="bFull" title="전체 화면">⛶</button></div>
      <div class="pill g"><button id="bSet" style="color:#fff">⚙ 설정</button></div>
    </div>
    <div class="hud bot">
      <div class="pill" id="camPill">
        <button data-cam="follow" class="on">🎥 크레인 따라가기</button>
        <button data-cam="full">🏠 기계 전체</button>
        <button data-cam="top">⬆ 위에서</button>
      </div>
      <div class="sp"></div>
      <button class="big hot" id="bDraw">뽑기!</button>
      <div class="sp"></div>
      <div class="pill"><button id="bAuto">▶▶ 자동 뽑기</button>
        <span class="note" style="margin:0">쪼는 맛</span><select id="tns" style="width:auto;padding:4px 8px;border-radius:10px"><option value="low">약하게</option><option value="mid">보통</option><option value="high">강하게</option></select>
        <select id="spd" style="width:auto;padding:4px 8px;border-radius:10px"><option value="0.7">느리게</option><option value="1" selected>보통</option><option value="1.8">빠르게</option></select>
        <button id="bSkip">⏭ 건너뛰기</button></div>
    </div>
    <div class="finish" id="finish"><div class="fbox"><div class="mascot" id="finMascot" style="display:grid;place-items:center"></div><h2>다 뽑았어요!</h2><p class="sub">자리가 모두 정해졌어요. 결과표를 확인하고 인쇄해 주세요.</p><button class="go" id="bResult" style="width:100%">결과 보기</button></div></div>
  </section>

  <!-- ================= 결과 화면 ================= -->
  <section id="result" class="view">
    <div class="rhead">
      <h2 id="rTitle">오늘의 자리 뽑기 결과</h2>
      <span class="note" id="rSaved"></span>
      <button class="btn" id="rBack">← 처음으로</button>
    </div>
    <div id="rBody"></div>
  </section>
</div>
<div id="printArea"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   두근두근 자리 뽑기  ·  © 김정환 · M.A.D.T (Moral And Digital Teacher)
   단일 HTML. 서버 없이 이 기기(브라우저)에만 저장합니다.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 설정값(교사 비밀번호 기본값 포함) ---------- */
const KEY='dudu-seat-v1';
const DEF={rosterText:'',mode:'pair',rows:4,groups:3,genderPair:true,avoidLast:true,autoFit:true,
  fixed:{},front:[],first:[],conf:[],confMode:'around',lockOn:false,pin:'0624',records:[],sound:true,
  gmode:'count',gcount:6,gsize:4,gbalance:true,gleader:true,gavoid:true,gfixed:{},tension:'high',blocked:[],name:'1-1'};
const CKEYS=['name','rosterText','mode','rows','groups','genderPair','avoidLast','autoFit','fixed','front','first','conf','confMode','blocked','gmode','gcount','gsize','gbalance','gleader','gavoid','gfixed','records'];
const clone=o=>JSON.parse(JSON.stringify(o));
function newClass(name,from){
  const c={id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1000)};
  CKEYS.forEach(k=>c[k]=clone(DEF[k]));c.name=name;
  if(from)['mode','rows','groups','genderPair','confMode','blocked','gmode','gcount','gsize','gbalance','gleader','gavoid','avoidLast'].forEach(k=>c[k]=clone(from[k]));
  return c;
}
function load(){
  let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const s={lockOn:!!o.lockOn,pin:o.pin||'0624',sound:o.sound!==false,tension:o.tension||'high'};
  let classes=o.classes;
  if(!classes||!classes.length){const c=newClass('1-1');CKEYS.forEach(k=>{if(o[k]!==undefined)c[k]=o[k]});c.name='1-1';classes=[c]}
  const cur=o.cur&&classes.some(c=>c.id===o.cur)?o.cur:classes[0].id,cl=classes.find(c=>c.id===cur);
  s.classes=classes;s.cur=cur;
  CKEYS.forEach(k=>{s[k]=cl[k]!==undefined?clone(cl[k]):clone(DEF[k])});
  return s;
}
let S=load();
function save(){try{const cl=S.classes.find(c=>c.id===S.cur);CKEYS.forEach(k=>cl[k]=S[k]);localStorage.setItem(KEY,JSON.stringify({lockOn:S.lockOn,pin:S.pin,sound:S.sound,tension:S.tension,cur:S.cur,classes:S.classes}))}catch(e){}}
function switchClass(id){
  save();const cl=S.classes.find(c=>c.id===id);if(!cl)return;
  S.cur=id;CKEYS.forEach(k=>{S[k]=cl[k]!==undefined?clone(cl[k]):clone(DEF[k])});pickName='';save();
}

/* ---------- 마스코트(꿈송이) : dreamson.png 를 같은 폴더에 넣으면 자동 교체 ---------- */
function mascot(size){
  const svg=`<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="56" r="34" fill="#ffd9e4"/><circle cx="30" cy="40" r="16" fill="#ffd9e4"/><circle cx="70" cy="40" r="16" fill="#ffd9e4"/><circle cx="50" cy="30" r="16" fill="#ffe9f0"/><circle cx="40" cy="56" r="4" fill="#27402f"/><circle cx="62" cy="56" r="4" fill="#27402f"/><ellipse cx="33" cy="66" rx="6" ry="4" fill="#ffb3c8"/><ellipse cx="69" cy="66" rx="6" ry="4" fill="#ffb3c8"/><path d="M45 66q6 6 12 0" stroke="#27402f" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M50 8l3 7h7l-6 5 2 7-6-4-6 4 2-7-6-5h7z" fill="#ffe27a"/></svg>`;
  return `<img src="kkumsong.png" width="${size}" height="${size}" style="object-fit:contain" alt="" onerror="this.outerHTML=this.dataset.fb" data-fb='${svg.replace(/'/g,"&#39;")}'>`;
}
$('#logoMascot').innerHTML=mascot(44);

/* ---------- 학생 명단 파싱 ---------- */
function parseRoster(t){
  const out=[],seen={};
  t.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const toks=line.split(/\t|,|\s+/).map(x=>x.trim()).filter(Boolean);
    let g='',nm=[];
    toks.forEach(tk=>{
      if(/^(남|남자|남학생|M|male)$/i.test(tk)) g='m';
      else if(/^(여|여자|여학생|F|female)$/i.test(tk)) g='f';
      else if(/^\d+$/.test(tk)||/^(번호|이름|성별|no|name)$/i.test(tk)){}
      else nm.push(tk);
    });
    let name=nm.join(' ').trim(); if(!name) return;
    seen[name]=(seen[name]||0)+1;
    if(seen[name]>1) name+=['','','②','③','④','⑤'][seen[name]]||('#'+seen[name]);
    out.push({name,g});
  });
  return out;
}
const students=()=>parseRoster(S.rosterText);

/* ---------- 자리 계산 ---------- */
const cols=(L=S)=>L.mode==='pair'?L.groups*2:L.groups;
const totalSeats=(L=S)=>L.rows*cols(L);
const nSeats=(L=S)=>totalSeats(L)-(L.blocked||[]).filter(i=>i<totalSeats(L)).length;
function seatLabel(i,L=S){
  const C=cols(L),r=Math.floor(i/C),c=i%C;
  return L.mode==='pair'?`${r+1}줄 ${Math.floor(c/2)+1}분단 ${c%2?'오른쪽':'왼쪽'}`:`${r+1}줄 ${c+1}열`;
}
function adjacent(a,b){
  const C=cols(),r1=Math.floor(a/C),c1=a%C,r2=Math.floor(b/C),c2=b%C;
  if(a===b) return false;
  if(S.confMode==='desk') return S.mode==='pair'?(r1===r2&&(c1>>1)===(c2>>1)):(r1===r2&&Math.abs(c1-c2)===1);
  return Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1;
}
function lastMap(){
  const r=S.records.find(x=>!x.type); if(!r||r.mode!==S.mode||r.rows!==S.rows||r.groups!==S.groups) return null;
  return r.seats;
}
function solve(st,last){
  const n=st.length,N=totalSeats(),C=cols(),BL=new Set(S.blocked||[]);
  const idx={};st.forEach((s,i)=>idx[s.name]=i);
  const fixedSeat={};Object.entries(S.fixed).forEach(([nm,sd])=>{if(idx[nm]!==undefined&&sd<N&&!BL.has(sd))fixedSeat[idx[nm]]=sd});
  const front=S.front.filter(nm=>idx[nm]!==undefined&&fixedSeat[idx[nm]]===undefined).map(nm=>idx[nm]);
  const conf=S.conf.filter(p=>idx[p[0]]!==undefined&&idx[p[1]]!==undefined).map(p=>[idx[p[0]],idx[p[1]]]);
  const pairOn=S.mode==='pair'&&S.genderPair;
  const par=i=>st[i].g==='f'?0:st[i].g==='m'?1:-1;
  let best=null;
  for(let at=0;at<4000;at++){
    const seatOf=new Array(n).fill(-1),used=new Array(N).fill(false);
    BL.forEach(b=>{if(b<N)used[b]=true});
    Object.entries(fixedSeat).forEach(([i,sd])=>{seatOf[i]=sd;used[sd]=true});
    const free=()=>{const a=[];for(let s=0;s<N;s++)if(!used[s])a.push(s);return shuffle(a)};
    shuffle(front.slice()).forEach(i=>{
      let cand=[];
      for(let r=0;r<S.rows&&!cand.length;r++)for(let c=0;c<C;c++){const s=r*C+c;if(!used[s])cand.push(s)}
      shuffle(cand);
      if(pairOn&&par(i)>=0){const m=cand.find(s=>s%C%2===par(i));if(m!==undefined)cand=[m]}
      seatOf[i]=cand[0];used[cand[0]]=true;
    });
    const rest=shuffle(st.map((_,i)=>i).filter(i=>seatOf[i]<0));
    if(pairOn){
      const fs=free(),girlS=fs.filter(s=>s%C%2===0),boyS=fs.filter(s=>s%C%2===1),left=[];
      rest.forEach(i=>{
        const p=par(i);let s;
        if(p===0&&girlS.length)s=girlS.pop();else if(p===1&&boyS.length)s=boyS.pop();else{left.push(i);return}
        seatOf[i]=s;used[s]=true;
      });
      const fs2=free();left.forEach((i,k)=>{seatOf[i]=fs2[k];used[fs2[k]]=true});
    }else{const fs=free();rest.forEach((i,k)=>{seatOf[i]=fs[k]})}
    let v=0;
    conf.forEach(([a,b])=>{if(adjacent(seatOf[a],seatOf[b]))v+=100});
    if(S.avoidLast&&last)st.forEach((s,i)=>{if(last[s.name]===seatOf[i])v+=1});
    if(!best||v<best.v)best={v,seatOf:seatOf.slice()};
    if(v===0)break;
  }
  return best;
}

/* ---------- 모둠 계산 ---------- */
function groupCount(n){return n<1?S.gcount:Math.max(1,Math.min(n,S.gmode==='count'?S.gcount:Math.ceil(n/S.gsize)))}
function solveGroups(st,G){
  const n=st.length,idx={};st.forEach((s,i)=>idx[s.name]=i);
  const conf=S.conf.filter(p=>idx[p[0]]!==undefined&&idx[p[1]]!==undefined).map(p=>[idx[p[0]],idx[p[1]]]);
  const fixedG={};Object.entries(S.gfixed).forEach(([nm,g])=>{if(idx[nm]!==undefined&&g<G)fixedG[idx[nm]]=g});
  const lastPairs=new Set(),lr=S.records.find(r=>r.type==='group');
  if(S.gavoid&&lr)lr.groups.forEach(g=>{const m=g.members;for(let a=0;a<m.length;a++)for(let b=a+1;b<m.length;b++)lastPairs.add([m[a],m[b]].sort().join('|'))});
  const base=Math.floor(n/G),ex=n%G;
  let best=null;
  for(let at=0;at<3000;at++){
    const cap=Array(G).fill(base);shuffle([...Array(G).keys()]).slice(0,ex).forEach(g=>cap[g]++);
    const grp=Array.from({length:G},()=>[]);
    Object.entries(fixedG).forEach(([i,g])=>{grp[g].push(+i);if(grp[g].length>cap[g])cap[g]=grp[g].length});
    const rest=shuffle(st.map((_,i)=>i).filter(i=>fixedG[i]===undefined));
    const seq=S.gbalance?[...rest.filter(i=>st[i].g==='f'),...rest.filter(i=>st[i].g==='m'),...rest.filter(i=>!st[i].g)]:rest;
    seq.forEach(i=>{
      let c=grp.map((_,k)=>k).filter(k=>grp[k].length<cap[k]);
      if(!c.length)c=grp.map((_,k)=>k);
      if(S.gbalance&&st[i].g){const cnt=k=>grp[k].filter(j=>st[j].g===st[i].g).length,mn=Math.min(...c.map(cnt));c=c.filter(k=>cnt(k)===mn)}
      grp[pick(c)].push(i);
    });
    let v=0;
    conf.forEach(([a,b])=>{if(grp.some(g=>g.includes(a)&&g.includes(b)))v+=100});
    if(lastPairs.size)grp.forEach(g=>{for(let a=0;a<g.length;a++)for(let b=a+1;b<g.length;b++)if(lastPairs.has([st[g[a]].name,st[g[b]].name].sort().join('|')))v+=1});
    if(!best||v<best.v)best={v,groups:grp.map(g=>g.slice())};
    if(v===0)break;
  }
  best.leaders=best.groups.map(g=>g.length?pick(g):-1);
  return best;
}
function buildGroupGeo(groups){
  const G=groups.length,TC=Math.ceil(Math.sqrt(G*1.5)),TR=Math.ceil(G/TC),tw=860/TC,th=300/TR;
  const PAST=['#ffe3ec','#fff0c2','#dff3e4','#ddeeff','#eadfff','#ffe5d2'];
  const geo=[],tabs=[],seatOf={};
  groups.forEach((g,gi)=>{
    const tx=70+(gi%TC)*tw+tw*.06,ty=110+Math.floor(gi/TC)*th+th*.16,tW=tw*.88,tH=th*.78,k=g.length;
    tabs.push({x:tx,y:ty,w:tW,h:tH,col:PAST[gi%6],name:`${gi+1}모둠`});
    const cs=k>1?2:1,rowsS=Math.ceil(k/cs),sw=tW/cs*.86,sh=Math.min(tH/rowsS*.62,sw*.6);
    g.forEach((si,m)=>{
      const c=m%cs,r=Math.floor(m/cs);
      const x=tx+c*(tW/cs)+(tW/cs-sw)/2,y=ty+tH*.08+r*(tH*.9/rowsS);
      seatOf[si]=geo.length;
      geo.push({x,y,w:sw,h:sh,cx:x+sw/2,cy:y+sh/2,sw:sw/.94,gname:`${gi+1}모둠`});
    });
  });
  return {geo,tabs,seatOf};
}
function startGroup(){
  const s=students();
  if(s.length<2)return toast('먼저 학생 명단을 넣어 주세요');
  const G=groupCount(s.length),r=solveGroups(s,G);
  if(r.v>=100)toast('조건을 모두 지키는 모둠을 못 찾아 가장 가까운 편성으로 진행해요');
  const gi=buildGroupGeo(r.groups);
  gi.groups=r.groups;gi.leaders=r.leaders;
  begin(s,s.map((_,i)=>gi.seatOf[i]),gi);
}

async function loadFile(f){
  if(!f)return;
  try{
    if(/\.(xlsx|xls)$/i.test(f.name)){
      if(!window.XLSX){await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const texts=wb.SheetNames.map(n=>[n,XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}).map(r=>r.join('\t')).join('\n')]);
      if(texts.length>1){
        save();let firstId=null;
        texts.forEach(([n,t])=>{let c=S.classes.find(x=>x.name===n);if(!c){c=newClass(n,S);S.classes.push(c)}c.rosterText=t;firstId=firstId||c.id});
        S.classes.forEach(c=>{if(texts.some(([n])=>n===c.name)){switchClass(c.id);if(S.autoFit)fit();save()}});
        switchClass(firstId);refreshAll();toast(`시트 ${texts.length}개를 반별로 불러왔어요`);return;
      }
      S.rosterText=texts[0][1];
    }else S.rosterText=await f.text();
    if(S.autoFit)fit();save();refreshAll();toast('명단을 불러왔어요');
  }catch(err){toast('파일을 읽지 못했어요. 엑셀에서 복사해 붙여 넣어 보세요')}
}

function buildGeo(){

  let sw,gg;
  if(pair){const G=S.groups;sw=800/(2*G+(G-1)*.7);gg=sw*.7}else{sw=800/(C+(C-1)*.3);gg=sw*.3}
  const rp=270/R,dh=Math.min(rp*.62,sw*.62);
  const a=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){

    a.push({x,y,w:sw*.94,h:dh,cx:x+sw*.47,cy:y+dh/2,sw,blocked:(S.blocked||[]).includes(r*C+c)});

}

function drawCrane(now){

  line([40,60,ZT],[40,740,ZT],'#9fb394',7*baseZ*cam.Z);line([960,60,ZT],[960,740,ZT],'#9fb394',7*baseZ*cam.Z);
  line([40,cy,ZT],[960,cy,ZT],'#7f9a73',9*baseZ*cam.Z);
  {const [x,y,s]=P(cx,cy,ZT);rr(x-22*s,y-11*s,44*s,22*s,6*s);ctx.fillStyle='#2f5d3f';ctx.fill()}

  ctx.fillStyle='#e8772e';ctx.beginPath();ctx.arc(hx,hy,11*hs,0,7);ctx.fill();

  ctx.strokeStyle='#e8772e';ctx.lineWidth=5*hs;ctx.lineCap='round';
  [-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(hx+d*8*hs,hy+4*hs);ctx.quadraticCurveTo(hx+d*(sp+8*hs),hy+14*hs,hx+d*(sp-(crane.open<.5?10:0)*hs),hy+38*hs);ctx.stroke()});

    if(held.dropping===undefined)held.z=clawZ-held.r*.9;
    const [px,py,ps,rad]=capsule(held.x,held.y,held.z,held.r,held.col);

function camUpdate(){

  else if(camMode==='top')t={fx:500,fy:390,Z:.98*zb,t:1.2};
  else t={fx:crane.x*.25+375,fy:crane.y*.25+300,Z:1*zb,t:.72};
  for(const k of ['fx','fy','Z','t'])cam[k]+=(t[k]-cam[k])*.07;

/* ----- 연출 도우미 ----- */
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(ms,fn){
  const my=token;
  return new Promise((res,rej)=>{
    const t0=performance.now(),dur=ms/speed;
    (function step(now){
      if(my!==token)return rej('cancel');
      const k=Math.min(1,(now-t0)/dur);fn(ease(k),k);
      k<1?requestAnimationFrame(step):res();
    })(t0);
  });
}
const moveTo=(x,y,ms)=>{const a=crane.x,b=crane.y;return tween(ms,k=>{crane.x=a+(x-a)*k;crane.y=b+(y-b)*k})};
const lowerTo=(L,ms)=>{const a=crane.L;return tween(ms,k=>{crane.L=a+(L-a)*k})};
const openTo=(v,ms)=>{const a=crane.open;return tween(ms,k=>{crane.open=a+(v-a)*k})};
const wobble=(amp)=>tween(650,(k,r)=>{crane.sway=Math.sin(r*Math.PI*7)*16*(1-r)*(amp||1)}).then(()=>{crane.sway=0});
function waitS(ms){const my=token;return new Promise((res,rej)=>setTimeout(()=>my!==token?rej('cancel'):res(),ms/speed))}

function sfx(kind){
  if(!S.sound)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const tone=(f,d,type,vol,delay)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)};
    if(kind==='go')tone(520,.12,'square',.04);
    else if(kind==='grab'){tone(330,.1,'square',.05);tone(440,.12,'square',.05,.1)}
    else if(kind==='catch'){tone(660,.1,'triangle',.08);tone(880,.18,'triangle',.08,.1)}
    else if(kind==='tick'){tone(900,.05,'square',.04)}
    else if(kind==='drum'){for(let i=0;i<6;i++)tone(180+i*18,.09,'triangle',.07,i*.09)}
    else if(kind==='drop'){tone(300,.18,'sawtooth',.05)}
    else if(kind==='stamp'){tone(140,.25,'square',.12);tone(880,.3,'triangle',.08,.05);tone(1175,.35,'triangle',.07,.14)}
    else if(kind==='end'){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.09,i*.12))}
  }catch(e){}
}

/* ----- 쪼는 맛 긴장 음악 (심장박동 + 점점 올라가는 사이렌) ----- */
let tm=null,tmLevel=0;
function tenseStart(){
  if(!S.sound||(S.tension||'high')==='low')return;
  try{
    tenseStop();
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const a=audio,out=a.createGain();out.gain.value=1;out.connect(a.destination);
    const o=a.createOscillator(),lp=a.createBiquadFilter(),wg=a.createGain();
    o.type='sawtooth';o.frequency.value=110;lp.type='lowpass';lp.frequency.value=500;wg.gain.value=.012;
    o.connect(lp);lp.connect(wg);wg.connect(out);o.start();
    const t0=a.currentTime;let next=t0+.05,n=0;
    const thump=(t,f,v)=>{const x=a.createOscillator(),g=a.createGain();x.type='sine';x.frequency.setValueAtTime(f,t);x.frequency.exponentialRampToValueAtTime(40,t+.16);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);x.connect(g);g.connect(out);x.start(t);x.stop(t+.22)};
    const tick=(t,f,v)=>{const x=a.createOscillator(),g=a.createGain();x.type='square';x.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);x.connect(g);g.connect(out);x.start(t);x.stop(t+.05)};
    const iv=setInterval(()=>{
      const now=a.currentTime,el=now-t0;
      const per=Math.max(.3,(tmLevel>=2?.42:tmLevel>=1?.58:.85)-el*.03);
      o.frequency.setTargetAtTime(110+Math.min(el,12)*38+tmLevel*90,now,.4);
      lp.frequency.setTargetAtTime(400+Math.min(el,12)*120,now,.4);
      wg.gain.setTargetAtTime(.012+Math.min(el,12)*.002+tmLevel*.008,now,.4);
      while(next<now+.25){
        thump(next,95,.22);thump(next+per*.28,80,.16);
        if(tmLevel>=1)tick(next+per*.5,1400+tmLevel*300,.025);
        if(tmLevel>=2)tick(next+per*.75,1800,.025);
        next+=per;n++;
      }
    },80);
    tm={a,o,out,iv};
  }catch(e){}
}
function tenseStop(){
  if(!tm)return;const m=tm;tm=null;
  try{clearInterval(m.iv);const t=m.a.currentTime;m.out.gain.cancelScheduledValues(t);m.out.gain.setTargetAtTime(0,t,.05);m.o.stop(t+.3)}catch(e){}
}

}
function startGame(){
  const s=students(),N=nSeats();
  if(!s.length)return toast('먼저 학생 명단을 넣어 주세요');
  if(s.length>N)return toast(`자리(${N}개)가 학생(${s.length}명)보다 적어요. '학생 수에 맞추기'를 눌러 주세요`);
  const r=solve(s,lastMap());
  if(r.v>=100)toast('조건을 모두 지키는 배치를 못 찾아 가장 가까운 배치로 진행해요');
  begin(s,r.seatOf);
}
function begin(students_,so,gi){
  token++;tenseStop();tmLevel=0;st=students_;seatOf=so;gInfo=gi||null;gtabs=gi?gi.tabs:null;geo=gi?gi.geo:buildGeo();
  filled=new Array(geo.length).fill(null);placedAt=new Array(geo.length).fill(0);labelOf=new Array(geo.length).fill('');
  crane={x:500,y:430,L:60,open:1,sway:0};held=null;spot=null;zb=1;done=0;busy=false;auto=false;saved=false;confetti=[];stamp=null;shake=0;

  const fixedIdx=[];

  const toDraw=st.map((_,i)=>i).filter(i=>!fixedIdx.includes(i));
  const firsts=shuffle(toDraw.filter(i=>S.first.includes(st[i].name))),others=shuffle(toDraw.filter(i=>!S.first.includes(st[i].name)));

    const x=500+(cc-(cnt-1)/2)*Math.min(820/Math.max(cnt,1),pr*3.1);

    return {i,x,y,z:pr,r:pr,col:COLORS[k%COLORS.length],gone:false,held:false}});
  prizes.sort((a,b)=>a.i-b.i);
  fixedIdx.forEach(i=>{});
  cam.fx=500;cam.fy=400;cam.Z=1;cam.t=.72;
  if(gi){camMode='full';$$('#camPill button').forEach(x=>x.classList.toggle('on',x.dataset.cam==='full'))}
  $('#hudTitle').textContent='● '+S.name+' · 두근두근 '+(gi?'모둠':'자리')+' 뽑기';

}

  if(busy||!order.length)return;
  busy=true;updateHud();
  try{
    const i=order.shift(),s=st[i],pz=prizes.find(p=>p.i===i),tgt=geo[seatOf[i]],num=done+1,tag='#'+pad(num)+' '+s.name;
    chip(tag,'뽑는 중…');sfx('go');updateHud();
    await moveTo(pz.x,pz.y,850+rand(0,300));
    await openTo(1,200);
    await lowerTo(ZT-(pz.r*2+16),650);
    sfx('grab');await openTo(.12,320);
    pz.held=true;held=pz;pz.dropping=undefined;
    await lowerTo(70,600);
    chip(tag,gtabs?'잡았다! 어느 모둠에 들어갈까?':'잡았다! 어느 자리에 앉게 될까?');sfx('catch');
    const spots=geo.map((_,k)=>k).filter(k=>k!==seatOf[i]&&!filled[k]&&!geo[k].blocked);
    const T=S.tension||'high',cfg={low:{n:[1,1],fake:0,fin:0,cd:false},mid:{n:[1,3],fake:.3,fin:1,cd:false},high:{n:[2,4],fake:.6,fin:2,cd:true}}[T];
    const lastOne=!order.length;
    tmLevel=0;tenseStart();
    const fakeDrop=async(d,msg)=>{
      tenseStop();chip(tag,msg);
      await openTo(1,200);
      held=null;pz.held=false;pz.dropping=true;pz.x=d.cx;pz.y=d.cy;
      const z0=ZT-crane.L-pz.r*.9;pz.z=z0;sfx('drop');
      await tween(320,k=>{pz.z=z0+(34+pz.r-z0)*k*k});
      shake=4;await waitS(700);
      chip(tag,'…아니었다! 다시 집는다');sfx('tick');
      await lowerTo(ZT-(34+pz.r*2+16),380);
      await openTo(.12,300);sfx('grab');
      pz.held=true;held=pz;pz.dropping=undefined;
      await lowerTo(70,500);
      tmLevel=0;tenseStart();
    };
    let tease=cfg.n[0]+Math.floor(Math.random()*(cfg.n[1]-cfg.n[0]+1));
    if(!lastOne&&T!=='low')tease=Math.max(1,tease-0);
    for(let t=0;t<tease&&spots.length;t++){
      const d=geo[spots.splice(Math.floor(Math.random()*spots.length),1)[0]];
      await moveTo(d.cx,d.cy,650+rand(0,300));
      await lowerTo(160,350);sfx('tick');await wobble(.8);
      if(Math.random()<cfg.fake||(lastOne&&T==='high'&&t===0)){await lowerTo(180,250);await fakeDrop(d,lastOne?'마지막 한 명이에요… 여기!?':'여기다!?')}
      else await lowerTo(70,280);
    }
    await moveTo(tgt.cx,tgt.cy,800);
    spot={x:tgt.cx,y:tgt.cy,t0:performance.now()};
    if(T!=='low')zb=1.22;
    chip(tag,'놓을까… 말까…');tmLevel=1;
    await lowerTo(170,520);sfx('drum');await wobble(1.5);await waitS(250);
    for(let f=0;f<cfg.fin;f++){
      await openTo(.65,220);sfx('tick');await wobble(.7);
      await openTo(.12,220);sfx('grab');chip(tag,f?'진짜 놓는다…?':'놓는다…?');await waitS(350);
    }
    if(cfg.cd)tmLevel=2;
    if(cfg.cd){for(const n of [3,2,1]){chip(tag,n+'…');sfx('drum');await waitS(750)}}
    await lowerTo(200,300);
    // 떨어뜨리기
    tenseStop();sfx('drop');spot=null;zb=1;
    pz.dropping=true;pz.z=ZT-crane.L-pz.r*.9;
    const z0=pz.z;
    held=null;pz.held=false;pz.x=tgt.cx;pz.y=tgt.cy;
    await Promise.all([openTo(1,260),tween(380,k=>{pz.z=z0+(34+pz.r-z0)*k*k})]);
    pz.gone=true;
    filled[seatOf[i]]=s.name;labelOf[seatOf[i]]=s.g;placedAt[seatOf[i]]=performance.now();
    stamp={t0:performance.now(),x:tgt.cx,y:tgt.cy};shake=7;sfx('stamp');
    {const [sx,sy]=P(tgt.cx,tgt.cy,60);for(let c=0;c<34;c++)confetti.push({x:sx,y:sy,vx:rand(-6,6),vy:rand(-11,-2),c:pick(COLORS),l:rand(40,70)})}
    done++;chip(tag,gtabs?`✔ ${tgt.gname} 확정!`:`✔ ${seatLabel(seatOf[i])} 자리 확정!`);
    await Promise.all([lowerTo(60,550),moveTo(500,430,750)]);
    busy=false;updateHud();
    if(!order.length){await waitS(900);finish();return}
    if(auto){await waitS(500);runOne()}
  }catch(e){tenseStop();if(e!=='cancel')console.error(e)}
}
function finish(){
  if(saved)return;saved=true;auto=false;busy=false;updateHud();
  const seats={};st.forEach((s,i)=>seats[s.name]=seatOf[i]);
  let rec;
  if(gInfo){
    rec={type:'group',ts:Date.now(),label:S.name+' · '+new Date().toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 모둠',
      groups:gInfo.groups.map((g,k)=>({members:g.map(i=>st[i].name),leader:S.gleader&&gInfo.leaders[k]>=0?st[gInfo.leaders[k]].name:''})),g:Object.fromEntries(st.map(s=>[s.name,s.g]))};
  }else rec={ts:Date.now(),label:S.name+' · '+new Date().toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 뽑기',mode:S.mode,rows:S.rows,groups:S.groups,blocked:(S.blocked||[]).slice(),seats,g:Object.fromEntries(st.map(s=>[s.name,s.g]))};
  S.records.unshift(rec);S.records=S.records.slice(0,30);save();lastRec=rec;
  sfx('end');$('#finMascot').innerHTML=mascot(96);$('#finish').classList.add('on');chip('끝!','모든 자리가 정해졌어요');
}
let lastRec=null;
function skipAll(){
  if(!order.length||saved)return;
  token++;tenseStop();busy=false;auto=false;held=null;spot=null;zb=1;
  order.forEach(i=>{const k=seatOf[i];filled[k]=st[i].name;labelOf[k]=st[i].g;placedAt[k]=-9999;const p=prizes.find(q=>q.i===i);p.gone=true});
  order=[];crane.L=60;crane.x=500;crane.y=430;crane.sway=0;updateHud();finish();
}
/* 버튼 */
$('#bDraw').onclick=()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}runOne()};
$('#bAuto').onclick=()=>{auto=!auto;updateHud();if(auto&&!busy)runOne()};
$('#bSkip').onclick=skipAll;
$('#spd').onchange=e=>speed=+e.target.value;
$('#tns').value=S.tension||'high';$('#tns').onchange=e=>{S.tension=e.target.value;save()};
$('#bSound').onclick=()=>{S.sound=!S.sound;if(!S.sound)tenseStop();save();$('#bSound').textContent=S.sound?'🔊':'🔇'};
$('#bSound').textContent=S.sound?'🔊':'🔇';
$('#bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#camPill').onclick=e=>{const b=e.target.closest('[data-cam]');if(!b)return;camMode=b.dataset.cam;$$('#camPill button').forEach(x=>x.classList.toggle('on',x===b))};
$('#bSet').onclick=()=>guard(()=>{token++;stageOn=false;busy=false;auto=false;showView('setup');refreshAll()});
$('#bResult').onclick=()=>{$('#finish').classList.remove('on');showResult(lastRec)};

/* =====================================================================
   결과 화면
   ===================================================================== */
function showView(id){$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));if(id!=='stage')stageOn=false}
function sheetHTML(rec,flip){
  const L={mode:rec.mode,rows:rec.rows,groups:rec.groups},C=cols(L),R=L.rows,pair=L.mode==='pair';
  const byS={};Object.entries(rec.seats).forEach(([n,s])=>byS[s]=n);
  const gOf=n=>(rec.g&&rec.g[n])||'';
  const rowsO=[...Array(R).keys()],colsO=[...Array(C).keys()];
  if(flip){rowsO.reverse();colsO.reverse()}
  const chunks=[];for(let i=0;i<colsO.length;i+=pair?2:1)chunks.push(colsO.slice(i,i+(pair?2:1)));
  let rowsH='';
  rowsO.forEach(r=>{rowsH+='<div class="sr">'+chunks.map(ch=>'<div class="sg">'+ch.map(c=>{const n=byS[r*C+c];return (rec.blocked||[]).includes(r*C+c)?'<div class="sc x"></div>':`<div class="sc ${n?gOf(n):'e'}">${n?esc(n):'빈자리'}</div>`}).join('')+'</div>').join('')+'</div>'});
  const head=`<div class="bd">칠 판</div><div class="tb">교 탁</div>`,foot=`<div class="tb">교 탁</div><div class="bd">칠 판</div>`;
  return `<div class="sheet">${flip?rowsH+foot:head+rowsH}</div>`;
}
let curRec=null;
function groupSheetHTML(rec){
  return '<div class="gcards">'+rec.groups.map((g,i)=>`<div class="gc c${i%6}"><div class="gh">${i+1}모둠 <span class="note">${g.members.length}명</span></div><ul>${g.members.map(m=>`<li>${m===g.leader?'👑 ':''}${esc(m)}</li>`).join('')}</ul></div>`).join('')+'</div>';
}
async function showPdf(rec,flip){
  try{
    if(!window.jspdf){await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
    const c=rec.type==='group'?groupCanvas(rec):sheetCanvas(rec,flip);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const pw=297,ph=210,m=10,r=Math.min((pw-2*m)/c.width,(ph-2*m)/c.height),w=c.width*r,h=c.height*r;
    pdf.addImage(c.toDataURL('image/png'),'PNG',(pw-w)/2,m,w,h);
    const url=URL.createObjectURL(pdf.output('blob'));
    if(!window.open(url,'_blank')){const a=document.createElement('a');a.href=url;a.download='자리배치표.pdf';document.body.appendChild(a);a.click();a.remove()}
  }catch(e){toast('PDF를 만들지 못했어요. 인쇄 화면에서 "PDF로 저장"을 써 보세요')}
}
function showGroupResult(rec){
  $('#rTitle').textContent='🎉 '+rec.label+' 결과';
  $('#rSaved').textContent='지난 기록에 자동 저장됐어요';
  $('#rBody').innerHTML=`<div class="sheetbox"><h3>👥 모둠 편성 <span class="note">👑 = 모둠장</span><span><button class="btn sm pri" data-r="gprint">🖨 인쇄</button> <button class="btn sm" data-r="gpdf">📄 PDF 보기</button> <button class="btn sm" data-r="gimg">🖼 이미지 저장</button> <button class="btn sm" data-r="gcopy">📋 엑셀용 복사</button> <button class="btn sm" data-r="again">🔄 같은 조건으로 다시 뽑기</button></span></h3>${groupSheetHTML(rec)}</div>`;
  showView('result');
}
function groupCanvas(rec){
  const per=3,cw=330,rowH=n=>60+n*38,G=rec.groups.length,rowsN=Math.ceil(G/per);
  const hs=[];for(let r=0;r<rowsN;r++)hs.push(Math.max(...rec.groups.slice(r*per,r*per+per).map(g=>rowH(g.members.length))));
  const wid=per*cw+(per+1)*20,hei=90+hs.reduce((a,b)=>a+b+20,0)+40;
  const c=document.createElement('canvas');c.width=wid;c.height=hei;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,wid,hei);x.textBaseline='middle';
  x.fillStyle='#27402f';x.textAlign='center';x.font=`700 34px ${FONT}`;x.fillText(rec.label+' · 모둠 편성',wid/2,46);
  const PAST=['#ffe3ec','#fff0c2','#dff3e4','#ddeeff','#eadfff','#ffe5d2'];
  rec.groups.forEach((g,i)=>{
    const r=Math.floor(i/per),cc=i%per,px=20+cc*(cw+20),py=90+hs.slice(0,r).reduce((a,b)=>a+b+20,0),h=hs[r];
    x.fillStyle=PAST[i%6];x.strokeStyle='#8fa584';x.lineWidth=2;x.beginPath();x.rect(px,py,cw,h);x.fill();x.stroke();
    x.textAlign='left';x.fillStyle='#27402f';x.font=`700 28px ${FONT}`;x.fillText(`${i+1}모둠`,px+18,py+30);
    x.font=`700 24px ${FONT}`;g.members.forEach((m,k)=>x.fillText((m===g.leader?'👑 ':'')+m,px+22,py+72+k*38));
  });
  x.fillStyle='#888';x.font=`400 14px ${FONT}`;x.textAlign='right';x.fillText('© 김정환 · M.A.D.T',wid-20,hei-16);
  return c;
}
function saveGroupImg(rec){
  const c=groupCanvas(rec);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='모둠편성표.png';document.body.appendChild(a);a.click();a.remove();toast('이미지를 저장했어요')});
}
function showResult(rec){
  if(!rec)return;curRec=rec;
  if(rec.type==='group')return showGroupResult(rec);
  $('#rTitle').textContent='🎉 '+rec.label+' 결과';
  $('#rSaved').textContent='지난 기록에 자동 저장됐어요';
  $('#rBody').innerHTML=`
   <div class="sheetbox"><h3>👩‍🎓 학생용 <span class="note">교실 뒤에서 칠판을 본 모습 (칠판이 위)</span><span><button class="btn sm pri" data-r="print0">🖨 학생용 인쇄</button> <button class="btn sm" data-r="pdf0">📄 PDF 보기</button> <button class="btn sm" data-r="img0">🖼 이미지 저장</button> <button class="btn sm" data-r="copy">📋 엑셀에 붙여넣기용 복사</button></span></h3>${sheetHTML(rec,false)}</div>
   <div class="sheetbox"><h3>👩‍🏫 교사용 <span class="note">교탁에서 학생들을 본 모습 (칠판이 아래)</span><span><button class="btn sm pri" data-r="print1">🖨 교사용 인쇄 (교탁에 붙이기)</button> <button class="btn sm" data-r="pdf1">📄 PDF 보기</button> <button class="btn sm" data-r="img1">🖼 이미지 저장</button></span></h3>${sheetHTML(rec,true)}</div>`;
  showView('result');
}
$('#rBack').onclick=()=>guard(()=>{token++;showView('setup');refreshAll()});
$('#rBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-r]');if(!b||!curRec)return;
  const a=b.dataset.r;
  if(a==='gprint'){$('#printArea').innerHTML=`<h1>${esc(curRec.label)} · 모둠 편성표</h1>${groupSheetHTML(curRec)}<div class="foot">© 김정환 · M.A.D.T</div>`;setTimeout(()=>window.print(),80);return}
  if(a==='gimg')return saveGroupImg(curRec);
  if(a==='gpdf')return showPdf(curRec);
  if(a==='pdf0'||a==='pdf1')return showPdf(curRec,a==='pdf1');
  if(a==='gcopy'){
    const gs=curRec.groups,mx=Math.max(...gs.map(g=>g.members.length)),L=[gs.map((_,i)=>`${i+1}모둠`).join('\t')];
    for(let r=0;r<mx;r++)L.push(gs.map(g=>g.members[r]?(g.members[r]===g.leader?'★':'')+g.members[r]:'').join('\t'));
    const t=L.join('\n'),fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요. 엑셀에 붙여 넣으세요')}catch(e){toast('복사하지 못했어요')}ta.remove()};
    navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('복사했어요. 엑셀에 붙여 넣으세요'),fb):fb();return}
  if(a==='again'){startGroup();return}
  if(a==='print0'||a==='print1'){
    $('#printArea').innerHTML=`<h1>${esc(curRec.label)} · 우리 반 자리 배치표 (${a==='print0'?'학생용':'교사용'})</h1>${sheetHTML(curRec,a==='print1')}<div class="foot">© 김정환 · M.A.D.T</div>`;
    setTimeout(()=>window.print(),80);
  }else if(a==='copy')copySheet(curRec);
  else if(a==='img0'||a==='img1')saveImg(curRec,a==='img1');
});
function copySheet(rec){
  const C=cols(rec),byS={};Object.entries(rec.seats).forEach(([n,s])=>byS[s]=n);
  const lines=[];for(let r=0;r<rec.rows;r++){const a=[];for(let c=0;c<C;c++)a.push(byS[r*C+c]||'');lines.push(a.join('\t'))}
  const t=lines.join('\n');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요. 엑셀에 붙여 넣으세요')}catch(e){toast('복사하지 못했어요')}ta.remove()};
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('복사했어요. 엑셀에 붙여 넣으세요'),fb):fb();
}
function sheetCanvas(rec,flip){
  const L={mode:rec.mode,rows:rec.rows,groups:rec.groups},C=cols(L),R=L.rows,pair=L.mode==='pair';
  const byS={};Object.entries(rec.seats).forEach(([n,s])=>byS[s]=n);
  const cw=140,ch=84,gap=pair?46:14,pad_=50,top=150;
  const gs=pair?L.groups:C,wid=pad_*2+gs*(pair?cw*2:cw)+(gs-1)*gap,hei=top+R*(ch+14)+150;
  const c=document.createElement('canvas');c.width=wid;c.height=hei;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,wid,hei);
  x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='#27402f';x.font=`700 34px ${FONT}`;x.fillText(`${rec.label} · 우리 반 자리 배치표 (${flip?'교사용':'학생용'})`,wid/2,48);
  const bd=(y,t)=>{x.fillStyle='#2f5d3f';x.fillRect(pad_,y,wid-pad_*2,40);x.fillStyle='#fff';x.font=`700 22px ${FONT}`;x.fillText(t.split('').join(' '),wid/2,y+20)};
  const gy=flip?0:1; if(!flip){bd(80,'칠판')}
  const rowsO=[...Array(R).keys()],colsO=[...Array(C).keys()];if(flip){rowsO.reverse();colsO.reverse()}
  rowsO.forEach((r,ri)=>colsO.forEach((cc,ci)=>{
    const g=pair?Math.floor(ci/2):ci,px=pad_+g*((pair?cw*2:cw)+gap)+(pair?(ci%2)*cw:0),py=top+ri*(ch+14),n=byS[r*C+cc];
    if((rec.blocked||[]).includes(r*C+cc))return;
    x.fillStyle=n?'#fbfdf8':'#f2f2f2';x.strokeStyle='#8fa584';x.lineWidth=2;x.beginPath();x.rect(px+3,py,cw-6,ch);x.fill();x.stroke();
    x.fillStyle=n?'#27402f':'#bbb';x.font=`700 ${n&&n.length>4?22:28}px ${FONT}`;x.fillText(n||'빈자리',px+cw/2,py+ch/2);
  }));
  if(flip){const y=top+R*(ch+14)+10;x.fillStyle='#ffe6c9';x.fillRect(wid/2-50,y,100,30);x.fillStyle='#27402f';x.font=`700 16px ${FONT}`;x.fillText('교 탁',wid/2,y+15);bd(y+44,'칠판')}
  x.fillStyle='#888';x.font=`400 14px ${FONT}`;x.textAlign='right';x.fillText('© 김정환 · M.A.D.T',wid-20,hei-16);
  return c;
}
function saveImg(rec,flip){
  const c=sheetCanvas(rec,flip);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`자리배치표_${flip?'교사용':'학생용'}.png`;document.body.appendChild(a);a.click();a.remove();toast('이미지를 저장했어요')});
}
