<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체육대회 점수판</title>
<link rel="icon" href="kkumsong.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f7fe;--panel:#ffffff;--panel2:#edf2fb;--line:#dbe4f3;--text:#15264f;--muted:#6b7a99;--navy:#1f3d7a;--navy2:#2b55a3;--accent:#ffc93c;--accent2:#ffe08a;--ok:#1f9d57;--bad:#e5484d;--shadow:0 6px 20px rgba(31,61,122,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
body{background:radial-gradient(1200px 600px at 100% -10%,#dfeaff 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#fff3cf 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
a{color:var(--navy2)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;color:var(--text);transition:transform .1s,filter .15s,background .15s}
button:hover{background:var(--panel2)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.pri:hover{background:var(--navy2)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.ok:hover{filter:brightness(1.08)}
button.bad{background:#fff;border-color:#f3c1c3;color:var(--bad)}
button.bad:hover{background:#fdecec}
button.sm{padding:6px 10px;font-size:13px}
button.on{outline:3px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
input:focus,select:focus{outline:2px solid var(--navy2);outline-offset:0;border-color:transparent}
input[type=color]{padding:2px;height:42px;width:56px;flex:none}
label{font-size:13px;color:var(--muted);display:block;margin:0 0 4px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:17px;color:var(--navy)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{white-space:nowrap;border-radius:999px}
.tabs button.cur{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.rowf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.grow{flex:1;min-width:120px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--panel2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.live{background:var(--bad);color:#fff}
.chip.done{background:#dcf5e6;color:#137a42}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);display:inline-block;flex:none;box-shadow:0 0 0 3px rgba(229,72,77,.15)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,87,.15)}
.sw{width:18px;height:18px;border-radius:5px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.12)}
.evpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;color:var(--navy)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:54px;width:auto;filter:drop-shadow(0 3px 6px rgba(31,61,122,.15))}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}
.hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#fff 0,#eef4ff 100%);border:1px solid var(--line);border-radius:24px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero img{height:150px;width:auto;flex:none;animation:bob 3s ease-in-out infinite}
.hero h1{margin:0 0 6px;font-size:28px;color:var(--navy)}
.hero .bubble{display:inline-block;background:var(--accent2);color:#5a4200;border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.home a{display:block;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:transform .15s}
.home a:hover{transform:translateY(-3px)}
.home a b{font-size:20px;display:block;margin-bottom:6px;color:var(--navy)}
.qrbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qrbox>div{background:var(--panel2);border-radius:14px;padding:12px;text-align:center}
.qr{background:#fff;padding:8px;border-radius:10px;display:inline-block;margin:8px 0}
.qr img,.qr canvas{display:block}
.link{font-size:12px;word-break:break-all;color:var(--muted)}
.warn{background:#fdecec;border:1px solid #f3c1c3;color:#9b1c20;border-radius:12px;padding:12px;margin-bottom:12px}
.notice{background:#fff6d9;border:1px solid var(--accent);color:#5a4200;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:500}
.vrow{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.vrk{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:900;color:var(--navy)}
.vrk.g1{background:var(--accent);color:#3d2c00}
.vbar{height:7px;border-radius:4px;background:var(--panel2);margin-top:5px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--c);transition:width .8s}
.cheer{padding:10px;border-radius:12px;background:var(--panel2);margin-bottom:8px;border-left:5px solid var(--c)}
.lockcard{text-align:center;padding:30px}
.lockcard img{height:120px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(31,61,122,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
/* ===== 전광판 ===== */
.board{height:100vh;display:flex;flex-direction:column;padding:2vh 2vw;gap:1.6vh;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:2vw;background:var(--navy);color:#fff;border-radius:2.4vh;padding:1.2vh 2vw 1.2vh 1vw;box-shadow:var(--shadow);position:relative;overflow:hidden}
.bhead::after{content:"";position:absolute;left:-4vh;bottom:-8vh;width:20vh;height:20vh;border-radius:50%;background:rgba(255,201,60,.16)}
.bleft{display:flex;align-items:center;gap:1.2vw;min-width:0}
.bleft img{height:11vh;width:auto;filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.btitle{font-size:clamp(22px,4.6vh,64px);font-weight:900;line-height:1.1}
.bsub{font-size:clamp(13px,2.3vh,30px);color:var(--accent2)}
.bright{display:flex;align-items:center;gap:1vw;font-size:clamp(14px,2.6vh,32px);position:relative;z-index:1}
.bmain{flex:1;display:grid;grid-template-columns:1fr 25vw;gap:1.5vw;min-height:0}
.bcols{display:grid;gap:1.2vw;min-height:0}
.bcol{background:#fff;border:1px solid var(--line);border-radius:2.4vh;padding:1.8vh 1.3vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.bcol h2{margin:0 0 1vh;font-size:clamp(16px,3.2vh,42px);color:var(--navy);display:flex;align-items:center;gap:.4em}
.bcol h2::before{content:"";width:.35em;height:1em;border-radius:.2em;background:var(--accent)}
.brows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.brow{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:.6em;font-size:var(--fs)}
.brk{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--navy);font-weight:900}
.brow.g1 .brk{background:var(--accent);color:#3d2c00;box-shadow:0 0 0 .15em #fff3c4}
.brow.g2 .brk{background:#d5dde9;color:#2a3550}
.brow.g3 .brk{background:#efc49a;color:#4b2a0c}
.bnm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar{height:.34em;border-radius:1em;background:var(--panel2);margin-top:.2em;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--c);border-radius:1em;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bsc{font-weight:900;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right;color:var(--navy)}
.brow.rev{animation:pop .9s ease}
.brow.hid .bnm,.brow.hid .bsc{color:#b3bdd0}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.bside{display:flex;flex-direction:column;gap:1.5vh;min-height:0}
.bbox{background:#fff;border:1px solid var(--line);border-radius:2.4vh;padding:1.6vh 1.2vw;font-size:clamp(13px,2.4vh,30px);overflow:hidden;box-shadow:var(--shadow)}
.bbox h3{margin:0 0 .8vh;font-size:1.05em;color:var(--navy)}
.bbox .ln{padding:.35em 0;border-bottom:1px solid var(--line)}
.bbox .ln:last-child{border-bottom:0}
.bbox.live{background:#fff5f5;border-color:#f6caca}
.bbox.live h3{color:var(--bad)}
.bside{overflow:hidden}
.mascot{display:flex;align-items:center;gap:.8vw;flex:none;margin-top:auto;background:linear-gradient(135deg,#fff8de,#fff);border:1px solid #ffe7a1;border-radius:2.4vh;padding:1.2vh 1vw;box-shadow:var(--shadow)}
.mascot img{height:15vh;width:auto;flex:none;animation:bob 3s ease-in-out infinite}
.mascot .say{background:var(--accent2);color:#4a3600;border-radius:2vh;padding:1.2vh 1vw;font-weight:700;font-size:clamp(13px,2.3vh,28px);position:relative;line-height:1.35}
.mascot .say::after{content:"";position:absolute;left:-1.6vh;top:50%;margin-top:-1vh;border:1vh solid transparent;border-right-color:var(--accent2);border-right-width:.9vh}
.lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(243,247,254,.86);font-size:clamp(18px,3.6vh,48px);font-weight:900;color:var(--navy);pointer-events:none}
.lock img{height:14vh;display:block;margin:0 auto 1vh}
.ticker{background:var(--navy);color:#fff;border-radius:1.8vh;overflow:hidden;white-space:nowrap;font-size:clamp(14px,3.2vh,40px);padding:1.1vh 0}
.ticker span{display:inline-block;padding-left:100%;animation:mq linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.fsbtn{font-size:.7em;padding:.3em .8em;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.fsbtn:hover{background:rgba(255,255,255,.22)}
@media (max-width:820px){.board{height:auto;overflow:visible}.bmain{grid-template-columns:1fr}.bcols{grid-template-columns:1fr!important}.brow{--fs:20px!important}.hero{flex-direction:column;text-align:center}.hero img{height:120px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   ★ 1단계: 아래 firebaseConfig 안의 값을 내 Firebase 프로젝트 값으로 바꾸세요.
   (Firebase 콘솔 → 프로젝트 설정 → 내 앱 → SDK 설정 및 구성 → "구성" 복사)
   databaseURL 은 Realtime Database를 만든 뒤에 생깁니다. 꼭 들어 있어야 합니다.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDak_jmHLaqYBGbrK91C_ceZbV2MiLf_GY",
  authDomain: "sports-19ecd.firebaseapp.com",
  databaseURL: "https://sports-19ecd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sports-19ecd",
  storageBucket: "sports-19ecd.firebasestorage.app",
  messagingSenderId: "460834209817",
  appId: "1:460834209817:web:3166dc9c1719c50763aa88"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, push, remove, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const KS = 'kkumsong.png';
const KSIMG = (c = '') => `<img src="${KS}" alt="꿈송이" class="${c}" onerror="this.style.display='none'">`;
const COPY = '© 김정환 · M.A.D.T (Moral And Digital Teacher)';
const P = new URLSearchParams(location.search);
const MODE = ['board','view','admin'].includes(P.get('m')) ? P.get('m') : 'home';
const ROOM = (P.get('r') || 'main').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 30) || 'main';
const CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('여기에') && firebaseConfig.databaseURL;
const PALETTE = ['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#14b8a6','#ec4899','#84cc16','#06b6d4','#f43f5e','#8b5cf6'];
const EVENT_PRESETS = [['이어달리기','10,7,5,3'],['줄다리기','10,7,5,3'],['단체줄넘기','10,7,5,3'],['피구','10,7,5,3'],['판 뒤집기','10,7,5,3'],['공 굴리기','10,7,5,3'],['박 터뜨리기','10,7,5,3'],['계주(최종)','20,15,10,5']];

/* ---------- 공통 도우미 ---------- */
const $ = s => document.querySelector(s);
const appEl = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = o => Object.entries(o || {}).map(([id, v]) => ({ id, ...v }))
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
const parsePts = s => String(s || '').split(/[,\s]+/).filter(Boolean).map(Number).filter(n => !isNaN(n));
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#4c8dff';
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const clr = (...ids) => ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 3200); }
function korErr(e) {
  const m = String(e?.code || e?.message || e);
  if (/PERMISSION_DENIED|permission/i.test(m)) return '권한이 없습니다. 관리자 PIN 로그인 상태나 Firebase 보안 규칙을 확인해 주세요.';
  if (/operation-not-allowed|admin-restricted/i.test(m)) return 'Firebase에서 "익명 로그인"이 꺼져 있습니다. 콘솔 → Authentication → 로그인 방법 → 익명을 "사용 설정"해 주세요.';
  if (/network|offline|unavailable/i.test(m)) return '인터넷 연결이 불안정합니다. 연결되면 자동으로 다시 시도합니다.';
  if (/api-key|invalid-api-key/i.test(m)) return 'Firebase 설정값(apiKey)이 잘못되었습니다. 코드의 firebaseConfig를 다시 붙여넣어 주세요.';
  if (/Database URL|databaseURL/i.test(m)) return 'databaseURL이 잘못되었습니다. Realtime Database 주소를 firebaseConfig에 정확히 넣어 주세요.';
  if (/unauthorized-domain/i.test(m)) return '허용되지 않은 도메인입니다. Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 github.io 주소를 추가해 주세요.';
  return '오류가 발생했습니다: ' + m;
}
const W = p => p.catch(e => { toast(korErr(e), true); throw e; });
function link(m) { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('m', m); if (ROOM !== 'main') u.searchParams.set('r', ROOM); return u.toString(); }

/* ---------- 상태 ---------- */
const S = { meta: {}, teams: {}, events: {}, bonus: {}, notice: '', shown: {}, queue: {}, log: {}, isAdmin: false, connected: false, uid: null, ready: false, err: '' };
let db, auth, aTab = 'result', vTab = 'rank', selEvent = null, pending = false, subscribed = false, adminSubscribed = false;
const R = p => ref(db, `rooms/${ROOM}/${p}`);

/* ---------- 점수 계산 ---------- */
function eventPts(e, v) {
  if (e.type === 'score') return Number(v) || 0;
  const r = Number(v); if (!r) return 0;
  return parsePts(e.points)[r - 1] ?? 0;
}
function calc() {
  const tot = {};
  list(S.teams).forEach(t => tot[t.id] = { team: t, total: 0, bonus: 0, byEvent: {} });
  list(S.events).filter(e => e.status === 'done').forEach(e => {
    const res = e.results || {};
    for (const tid in res) { if (!tot[tid]) continue; const p = eventPts(e, res[tid]); tot[tid].byEvent[e.id] = p; tot[tid].total += p; }
  });
  list(S.bonus).forEach(b => { if (tot[b.teamId]) { const v = Number(b.points) || 0; tot[b.teamId].bonus += v; tot[b.teamId].total += v; } });
  return tot;
}
const groupList = () => { const g = []; list(S.teams).forEach(t => { const x = t.group || ''; if (!g.includes(x)) g.push(x); }); return g.length ? g : ['']; };
const teamsOf = g => list(S.teams).filter(t => !g || (t.group || '') === g);
function standings(g, tot) {
  const rows = list(S.teams).filter(t => (t.group || '') === g).map(t => tot[t.id]).sort((a, b) => b.total - a.total);
  let last = null, rank = 0;
  rows.forEach((r, i) => { if (r.total !== last) { rank = i + 1; last = r.total; } r.rank = rank; });
  return rows;
}
function winners(e) {
  const res = e.results || {}; const ids = Object.keys(res).filter(id => S.teams[id]);
  if (!ids.length) return [];
  if (e.type === 'score') { const mx = Math.max(...ids.map(id => Number(res[id]) || 0)); return ids.filter(id => (Number(res[id]) || 0) === mx); }
  return ids.filter(id => Number(res[id]) === 1);
}
function topText(e, n = 3) {
  const res = e.results || {}; const ids = Object.keys(res).filter(id => S.teams[id]);
  const arr = ids.map(id => ({ id, p: eventPts(e, res[id]), r: Number(res[id]) || 0 }));
  const sorted = e.type === 'score' ? arr : arr.filter(x => x.r).sort((a, b) => a.r - b.r);
  return sorted.slice(0, n).map((x, i) => `${e.type === 'score' ? (i + 1) : x.r}위 ${esc(S.teams[x.id].name)}`).join(' · ') || '결과 없음';
}
const tLabel = t => (t.group ? t.group + ' ' : '') + t.name;
const statusChip = s => s === 'live' ? '<span class="chip live">진행 중</span>' : s === 'done' ? '<span class="chip done">완료</span>' : '<span class="chip">대기</span>';

/* ---------- 렌더링 (입력 중에는 화면을 덮어쓰지 않음) ---------- */
function render() {
  const a = document.activeElement;
  if (MODE !== 'board' && a && appEl.contains(a) && a.matches('input:not([type=color]):not([type=checkbox]),textarea')) { pending = true; return; }
  draw();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pending) { pending = false; render(); } }, 60));
function setHTML(el, h) { if (el && el._h !== h) { el.innerHTML = h; el._h = h; } }
function draw() {
  // 입력값 보존
  const keep = {};
  appEl.querySelectorAll('input[id],select[id],textarea[id]').forEach(el => { if (el.type !== 'checkbox') keep[el.id] = el.value; });
  if (!CONFIGURED) { appEl.innerHTML = setupHTML(); return; }
  if (MODE === 'board') { drawBoard(); return; }

  appEl.innerHTML = `<div class="wrap">${h}<div class="foot">${COPY}</div></div>`;
  appEl.querySelectorAll('input[id],select[id],textarea[id]').forEach(el => { if (el.id in keep && !el.dataset.fresh) el.value = keep[el.id]; });
  drawQR();
}

  sh += `<div class="bbox"><h3>⏭️ 다음 경기</h3>${next.length ? next.map(e => `<div class="ln">${esc(e.name)}${e.group ? ` <span class="muted">${esc(e.group)}</span>` : ''}</div>`).join('') : '<div class="muted">-</div>'}</div>`;

async function move(path, id, d) {
  const arr = list(path === 'teams' ? S.teams : S.events); const i = arr.findIndex(x => x.id === id), j = i + d;
  if (j < 0 || j >= arr.length) return;
  const oi = arr[i].order ?? i, oj = arr[j].order ?? j;
  await W(update(R(path), { [`${arr[i].id}/order`]: oj === oi ? oi + d : oj, [`${arr[j].id}/order`]: oi }));
}

document.addEventListener('change', e => { const el = e.target.closest('[data-color]'); if (el) W(update(R(`teams/${el.dataset.color}`), { color: safeColor(el.value) })).catch(() => {}); });

function exportCSV() {
  const tot = calc(); const evs = list(S.events).filter(e => e.status === 'done');
  const head = ['그룹', '팀', ...evs.map(e => e.name), '보너스/감점', '합계', '순위'];
  const rows = []; groupList().forEach(g => standings(g, tot).forEach(r => rows.push([g || '전체', r.team.name, ...evs.map(e => r.byEvent[e.id] ?? ''), r.bonus, r.total, r.rank])));
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${(S.meta.title || '체육대회').replace(/[\\/:*?"<>|]/g, '')}_결과.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function printWin(title, body) {
  const w = window.open('', '_blank'); if (!w) return toast('팝업이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 눌러 주세요.', true);
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:'Noto Sans KR',sans-serif;margin:24px;color:#111}h1{font-size:22px}h2{font-size:17px;margin:18px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #444;padding:7px 8px;font-size:13px;text-align:center}th{background:#eee}.blk{page-break-inside:avoid}.ft{margin-top:24px;font-size:11px;color:#666;text-align:center}</style></head><body><h1>${esc(title)}</h1>${body}<div class="ft">${COPY}</div></body></html>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 500);
}
function printRank() {
  const tot = calc(); const evs = list(S.events).filter(e => e.status === 'done'); let b = '';
  groupList().forEach(g => { b += `<div class="blk"><h2>${esc(g || '종합')}</h2><table><tr><th>순위</th><th>팀</th>${evs.map(e => `<th>${esc(e.name)}</th>`).join('')}<th>보너스</th><th>합계</th></tr>${standings(g, tot).map(r => `<tr><td><b>${r.rank}</b></td><td>${esc(r.team.name)}</td>${evs.map(e => `<td>${r.byEvent[e.id] ?? ''}</td>`).join('')}<td>${r.bonus}</td><td><b>${r.total}</b></td></tr>`).join('')}</table></div>`; });
  printWin((S.meta.title || '체육대회') + ' 최종 순위표', b);
}
function printSheet() {
  const evs = list(S.events); if (!evs.length) return toast('종목을 먼저 등록해 주세요.', true); let b = '';
  evs.forEach(e => { b += `<div class="blk"><h2>${esc(e.name)} ${e.group ? '(' + esc(e.group) + ')' : ''} <span style="font-weight:400;font-size:12px">${e.type === 'score' ? '점수 기록' : '순위 점수: ' + esc(e.points)}</span></h2><table><tr><th style="width:30%">팀</th><th>${e.type === 'score' ? '점수' : '순위'}</th><th>심판 서명</th><th>비고</th></tr>${teamsOf(e.group).map(t => `<tr><td>${esc(t.name)}</td><td></td><td></td><td></td></tr>`).join('')}</table></div>`; });
  printWin((S.meta.title || '체육대회') + ' 종목별 기록지(백업용)', b);
}

/* ---------- Firebase 연결 ---------- */
function sub(path, key, fallback) { onValue(R(path), s => { S[key] = s.val() ?? fallback; S.ready = true; render(); }, e => { S.err = korErr(e); render(); }); }
function subscribe() {
  if (subscribed) return; subscribed = true;
  sub('meta', 'meta', {}); sub('teams', 'teams', {}); sub('events', 'events', {}); sub('bonus', 'bonus', {}); sub('notice', 'notice', ''); sub('shown', 'shown', {});
  onValue(ref(db, '.info/connected'), s => { S.connected = !!s.val(); render(); });
}
function subscribeAdmin() { if (adminSubscribed) return; adminSubscribed = true; sub('queue', 'queue', {}); sub('log', 'log', {}); }

if (CONFIGURED) {
  try {
    const fb = initializeApp(firebaseConfig); auth = getAuth(fb); db = getDatabase(fb);
    subscribe();
    onAuthStateChanged(auth, async u => {
      if (!u) { signInAnonymously(auth).catch(e => { S.err = korErr(e); render(); }); return; }
      S.uid = u.uid;
      if (MODE === 'admin') { try { S.isAdmin = (await get(ref(db, `admins/${u.uid}`))).exists(); } catch (e) { S.isAdmin = false; } if (S.isAdmin) subscribeAdmin(); }
      render();
    });
  } catch (e) { S.err = korErr(e); }
}
draw();
</script>
